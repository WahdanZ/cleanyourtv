<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap">
<style>
  /* Sizes are the Android launcher's dp values doubled: this TV's page is 1920 x 1080 at 1:1. */
  /* The helper serves the font itself; the hosted page gets it from Google Fonts (the link below). */
  @font-face { font-family: OutfitLocal; src: url(fonts/outfit.ttf) format("truetype"); font-weight: 100 900; }

  :root {
    --tile-w: 360px; --tile-h: 202px; --tile-r: 32px; --pitch: 423px;
    --band-pad: 28px; --dock-top: 698px;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: Outfit, OutfitLocal, sans-serif; color: #f2f2f2; -webkit-font-smoothing: antialiased; }

  /* A calm, steady background. Behind the hero only, the focused dock app's icon, blown up from a few pixels
     (a blur at no cost), glows faintly: two layers so one can fade into the next. */
  body { background: radial-gradient(circle 1500px at 18% 0%, #17171b 0%, #050506 60%, #000 100%); }
  .backdrop { position: absolute; left: 560px; top: 0; width: 1360px; height: 1080px; opacity: 0; pointer-events: none;
              background-size: 100% 100%; transition: opacity .8s ease;
              -webkit-mask-image: radial-gradient(ellipse 62% 58% at 68% 34%, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%);
              mask-image: radial-gradient(ellipse 62% 58% at 68% 34%, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%); }
  .backdrop.on { opacity: .42; }

  /* Wallpaper of the day (from the helper). Shades keep text readable: darker at the top, on the left behind the
     quote and name, and at the bottom behind the tiles; darker still while a grid row has focus. */
  #wall { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.2s ease;
          transform: translateZ(0); }
  #wall.on { opacity: 1; }
  #wallShade, #gridShade { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s ease; transform: translateZ(0); }
  #wallShade { background: linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.2) 26%, rgba(0,0,0,.18) 50%, rgba(0,0,0,.78) 82%, rgba(0,0,0,.9) 100%),
                           linear-gradient(90deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 62%),
                           radial-gradient(ellipse 760px 380px at 100% 34%, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 100%); }
  #gridShade { background: rgba(0,0,0,.55); }
  body.wallpaper #wallShade { opacity: 1; }
  body.wallpaper.ingrid #gridShade { opacity: 1; }
  body.wallpaper .backdrop { display: none; }
  body.wallpaper #header, body.wallpaper #quote, body.wallpaper #weather, body.wallpaper #wallCredit { text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  body.ingrid #wallCredit { opacity: 0; }

  /* The Glass look (home_layout.look = "glass"): cards, buttons and the dock are frosted glass over the photo. No live
     blur (too much for the TV): the photo is frosted once into a small picture (makeFrost), and each panel shows the
     part of it that lies under it (fixed to the screen), under a light tint and a bright rim. */
  body.glass.wallpaper #wallShade { opacity: .6; }
  body.glass .wcard, body.glass .pill:not(.focus), body.glass #band {
    background-color: rgba(255,255,255,.06);
    background-image: linear-gradient(180deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.06) 45%, rgba(255,255,255,.10) 100%), var(--frost, none);
    background-size: auto, 1920px 1080px; background-attachment: scroll, fixed; background-position: 0 0, 0 0; background-repeat: no-repeat;
    border-color: rgba(255,255,255,.34); box-shadow: inset 0 2px 0 rgba(255,255,255,.5); }

  /* Edit Home: the grid, an outline per block (the chosen one lit; red where it can't go), and a bar of keys. */
  #editLayer { position: absolute; left: 0; top: 0; width: 1920px; height: 680px; z-index: 4; pointer-events: none; }
  .ecell { position: absolute; border: 1px dashed rgba(255,255,255,.14); box-sizing: border-box; }
  .eb { position: absolute; border: 3px dashed rgba(255,255,255,.55); border-radius: 18px; box-sizing: border-box; }
  .eb.sel { border: 4px solid #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.18); }
  .eb.move { border-color: #4ade80; box-shadow: 0 0 0 6px rgba(74,222,128,.25); }
  .eb.bad { border-color: #ff6b6b; box-shadow: 0 0 0 6px rgba(255,107,107,.25); }
  .elabel { position: absolute; left: 10px; bottom: -48px; font-size: 24px; font-weight: 500; white-space: nowrap; background: rgba(0,0,0,.75);
            padding: 6px 14px; border-radius: 12px; display: none; text-shadow: none; }
  .eb.sel .elabel { display: block; }
  .eb.above .elabel { bottom: auto; top: -50px; }   /* above the block: its content may run past its bottom edge */
  #editBar { position: absolute; left: 50%; top: 760px; transform: translateX(-50%); z-index: 4; display: none; align-items: center; gap: 28px;
             padding: 18px 22px 18px 36px; border-radius: 48px; background: rgba(20,20,22,.92); border: 2px solid rgba(255,255,255,.18);
             font-size: 26px; white-space: nowrap; }
  #editAdd { padding: 14px 28px; border-radius: 32px; border: 2px solid rgba(255,255,255,.3); font-weight: 500; }
  #editAdd.focus { background: rgba(255,255,255,.96); color: #111; border-color: transparent; }
  body.editing #editBar { display: flex; }
  body.editing #viewport { opacity: .2; }
  body.editing #pills { opacity: .35; }
  body.static .pill[data-action="edit"] { display: none; }

  /* Now playing (the Chromecast's): art, what and who, playing or paused */
  .pill.np.live { box-shadow: inset 0 0 0 2px #f5b971; }
  #npBlock { display: flex; }
  .npcard { display: flex; align-items: center; gap: 22px; flex: 1; }
  .wslot .wcard.npcard { flex-direction: row; }   /* a widget slot's cards are columns; this one is art beside text */
  .np-art { width: 192px; height: 108px; object-fit: cover; border-radius: 14px; flex: none; background: rgba(255,255,255,.08); }
  .np-col { flex: 1; min-width: 0; }
  .np-app { font-size: 24px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-t { margin-top: 8px; font-size: 28px; font-weight: 500; line-height: 1.22; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .np-t.one { -webkit-line-clamp: 1; margin-top: 4px; font-size: 24px; }
  .np-s { margin-top: 4px; font-size: 24px; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-time { margin-top: 6px; font-size: 24px; color: rgba(255,255,255,.74); font-variant-numeric: tabular-nums; }

  /* Widget cards (add-ons): one per block, or two stacked in a four-row block. */
  .wslot { position: absolute; display: none; flex-direction: column; gap: 12px; transition: opacity .3s ease; }
  /* A card fills its share of the block and shows what fits: one line when short, no pictures when narrow,
     bigger pictures and more items when tall (what still doesn't fit is dropped whole, never cut). */
  .wslot .wcard { flex: 1 1 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .wcard .whead { flex: none; }
  .wcard.compact { flex-direction: row; align-items: center; gap: 16px; padding: 0 24px; }
  .wcard.compact .cline { flex: 1; min-width: 0; font-size: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wcard.compact .cline .sub { color: rgba(255,255,255,.74); }
  .wcard.compact .cline .sub.live { color: #ff6b6b; }
  .wslot .wcard { padding-top: 14px; padding-bottom: 14px; }
  .wslot .wmatch { margin-top: 6px; }
  .wslot .wmatch .mid { line-height: 1.15; }
  .wcard.narrow .wmatch img, .wcard.narrow .wnews img, .wcard.narrow:not(.tall) .wstrip { display: none; }
  .wcard.narrow.tall .wstrip { flex-direction: column; gap: 2px; }
  .wcard.narrow.tall .wstrip { gap: 0; }
  .wcard.narrow.tall .wstrip > div { display: flex; justify-content: space-between; align-items: baseline; padding: 1px 14px; text-align: left; }
  .wcard.narrow .wmatch .mid { width: 118px; }
  .wcard.narrow .wnext .n, .wcard.narrow .wnext .t { font-size: 34px; }
  .wcard.tall .wnews img { width: 264px; height: 180px; }
  .wcard { background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.12); border-radius: 28px; padding: 16px 28px 18px;
           box-sizing: border-box; text-shadow: none; }
  .whead { display: flex; align-items: center; gap: 14px; }
  .wemo { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
  .wtitle { flex: 1; min-width: 0; font-size: 24px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.7);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wdot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.28); margin-left: 7px; flex: none; }
  .wdot.on { width: 10px; height: 10px; background: rgba(255,255,255,.9); }
  .wline { margin-top: 8px; font-size: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(255,255,255,.92); }
  .wline:first-of-type { margin-top: 12px; }
  .wline .sub { color: rgba(255,255,255,.74); }
  .wline .sub.live { color: #ff6b6b; }
  .wmatch { display: flex; align-items: center; margin-top: 10px; }
  .wmatch img { width: 34px; height: 34px; object-fit: contain; flex: none; }
  .wmatch .team { flex: 1; min-width: 0; font-size: 24px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }
  .wmatch .team.home { text-align: right; }
  .wmatch .mid { width: 150px; text-align: center; flex: none; }
  .wmatch .big { font-size: 28px; font-weight: 600; }
  .wmatch .big.pre { font-size: 24px; font-weight: 500; }
  .wmatch .small { font-size: 22px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.74); }
  .wmatch .small.live { color: #fff; background: #e53935; border-radius: 8px; padding: 2px 10px; display: inline-block; }
  .wnext { margin-top: 10px; display: flex; align-items: baseline; gap: 14px; white-space: nowrap; }
  .wnext .n { font-size: 40px; font-weight: 500; }
  .wnext .t { font-size: 40px; font-weight: 400; color: rgba(255,255,255,.9); }
  .wnext .c { font-size: 26px; color: rgba(255,255,255,.74); }
  .wstrip { margin-top: 10px; display: flex; }
  .wstrip > div { flex: 1; text-align: center; padding: 6px 0 8px; border-radius: 14px; }
  .wstrip > div.lit { background: rgba(255,255,255,.16); }
  .wstrip .a { font-size: 22px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.74); }
  .wstrip .b { font-size: 26px; color: rgba(255,255,255,.8); }
  .wstrip .lit .a, .wstrip .lit .b { color: #fff; }
  .wnews { margin-top: 12px; display: flex; gap: 18px; }
  .wnews img { width: 176px; height: 120px; object-fit: cover; border-radius: 12px; flex: none; background: rgba(255,255,255,.08); margin-top: 4px; }
  .wnews .col { flex: 1; min-width: 0; }
  .wnews .h1 { font-size: 25px; font-weight: 500; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .wnews .h2 { margin-top: 6px; font-size: 24px; color: rgba(255,255,255,.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #wallCredit { position: absolute; right: 112px; top: 150px; z-index: 2; max-width: 680px; text-align: right; font-size: 24px;
                color: rgba(255,255,255,.74); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .3s ease; }

  /* Header: greeting, clock and date on the left, pills on the right. */
  #header { position: absolute; left: 112px; right: 112px; top: 52px; display: flex; align-items: center; z-index: 3; }
  #miniClock { font-size: 44px; font-weight: 400; letter-spacing: -.02em; opacity: 0; transition: opacity .3s ease; white-space: nowrap; }
  body.ingrid #miniClock { opacity: .9; }
  #pills { margin-left: auto; }
  #blocks { position: absolute; left: 0; top: 0; width: 1920px; height: 690px; z-index: 2; transition: opacity .3s ease; }
  body.ingrid #blocks { opacity: 0; }
  body.wallpaper #blocks { text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #left { position: absolute; left: 112px; top: 52px; min-width: 0; }
  #left.small #clockRow { align-items: baseline; }
  #left.small #clock { font-weight: 400; }
  #left.big #clockRow { flex-direction: column; align-items: flex-start; }
  #left.big #divider { display: none; }
  #left.big #date { margin-top: 18px; }
  /* Clock styles */
  #clockStyle { white-space: nowrap; }
  .cs-row { display: flex; align-items: center; gap: 28px; }
  .cs-bold { font-weight: 600; letter-spacing: -.035em; line-height: .95; }
  .cs-ap { font-weight: 500; letter-spacing: .08em; text-transform: uppercase; margin-left: 12px; opacity: .7; }
  .cs-bdate { margin-top: 10px; font-weight: 500; color: #f5b971; }
  .cs-stack { font-weight: 500; line-height: .9; letter-spacing: -.02em; }
  .cs-stack span { opacity: .55; }
  .cs-sdate { font-weight: 400; letter-spacing: .14em; text-transform: uppercase; line-height: 1.5; color: rgba(255,255,255,.75); }
  .cs-tiles { display: flex; align-items: center; gap: .1em; font-weight: 500; }
  .cs-tile { background: rgba(255,255,255,.13); border: 2px solid rgba(255,255,255,.12); border-radius: .16em; padding: .04em .14em; line-height: 1.1;
             box-shadow: inset 0 -.5em 0 rgba(0,0,0,.12); text-shadow: none; }
  .cs-colon { opacity: .6; padding: 0 .04em; }
  .cs-tdate { margin-top: 12px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.7); }
  .cs-face circle { fill: rgba(0,0,0,.18); stroke: rgba(255,255,255,.45); stroke-width: 2; }
  .cs-face .tk line { stroke: rgba(255,255,255,.7); stroke-width: 2; stroke-linecap: round; }
  .cs-face .hh { stroke: #fff; stroke-width: 5; stroke-linecap: round; }
  .cs-face .mh { stroke: #fff; stroke-width: 3; stroke-linecap: round; }
  .cs-face .pin { fill: #fff; stroke: none; }
  .cs-words { font-family: "Playfair Display", Georgia, serif; line-height: 1.12; white-space: normal; }
  .cs-words i { color: #f5b971; }
  .cs-wx { display: inline-flex; align-items: center; gap: .3em; margin-left: .8em; text-transform: none; letter-spacing: 0; }
  .cs-wx svg { width: 1.3em; height: 1.3em; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  #greeting { margin-left: 8px; font-size: 24px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.74); white-space: nowrap; }
  #clockRow { display: flex; align-items: flex-end; margin-top: 6px; }
  #clock { font-size: 104px; font-weight: 300; letter-spacing: -.04em; line-height: .86; }
  #ampm { margin: 0 0 6px 12px; font-size: 30px; font-weight: 500; letter-spacing: .08em; color: rgba(255,255,255,.7); text-transform: uppercase; }
  #divider { width: 2px; height: 52px; margin: 0 32px 0 32px; background: rgba(255,255,255,.2); }
  #date { margin-bottom: 8px; font-size: 28px; font-weight: 400; letter-spacing: .14em; color: rgba(255,255,255,.74); text-transform: uppercase; white-space: nowrap; }

  /* The buttons are round icons so all of them fit in the corner kept free for them (columns 7-11 of the layout grid);
     the focused one's name shows under it. */
  #pills { display: flex; gap: 12px; margin-bottom: 8px; position: relative; }
  .pill { height: 72px; padding: 0 28px 0 24px; border-radius: 36px; display: flex; align-items: center; gap: 12px;
          font-size: 27px; font-weight: 500; color: #f2f2f2; box-sizing: border-box;
          background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.08));
          border: 2px solid rgba(255,255,255,.22);
          transition: transform .2s ease, background-color .2s ease; }
  .pill svg { width: 34px; height: 34px; fill: currentColor; }
  .pill.round, .pill { width: 72px; padding: 0; justify-content: center; font-size: 0; gap: 0; }
  .pill .code { font-size: 26px; font-weight: 600; letter-spacing: .02em; }
  #pillTip { position: absolute; top: 86px; left: 0; white-space: nowrap; font-size: 24px; font-weight: 500; color: #f2f2f2;
             background: rgba(0,0,0,.72); border-radius: 14px; padding: 6px 16px; pointer-events: none; display: none; z-index: 4; }
  .pill.focus { background: rgba(255,255,255,.96); color: #111; border-color: transparent; transform: scale(1.06); }

  /* Everything below the header scrolls in one rail; the viewport clips it under the header with a soft fade. */
  #viewport { position: absolute; left: 0; right: 0; top: 230px; bottom: 0; overflow: hidden;
              -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 70px); mask-image: linear-gradient(180deg, transparent 0, #000 70px); }
  #rail { position: absolute; left: 0; top: -230px; width: 1920px; transition: transform .3s cubic-bezier(.2,.8,.2,1); will-change: transform; }

  /* Above the hero: the quote of the day with its author's portrait on the left, the weather on the right. */
  #quote { position: absolute; left: 108px; top: 300px; max-width: 1120px; box-sizing: border-box; display: flex; align-items: center; gap: 34px;
           transition: opacity .3s ease; }
  #quotePic { width: 116px; height: 116px; flex: none; border-radius: 50%; object-fit: cover; display: none;
              border: 3px solid rgba(255,255,255,.22); box-shadow: 0 10px 30px rgba(0,0,0,.55); }
  #quote.pic #quotePic { display: block; }
  #quoteText { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: 38px; line-height: 1.3;
               color: rgba(255,255,255,.93); }
  #quoteMeta { margin-top: 12px; display: flex; align-items: baseline; gap: 18px; white-space: nowrap; }
  #quoteBy { font-size: 24px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.74); }
  #quoteSrc { font-size: 24px; color: rgba(255,255,255,.74); }
  #weather { position: absolute; right: 103px; top: 296px; text-align: right; transition: opacity .3s ease; box-sizing: border-box; }
  #weather.small #wxInfo { display: none; }
  #weather.small #wxTemp { font-size: 60px; font-weight: 400; }
  #weather.small #wxIcon { width: 56px; height: 56px; }
  #wxTop { display: flex; align-items: center; justify-content: flex-end; gap: 18px; }
  #wxIcon { width: 76px; height: 76px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #wxTemp { font-size: 88px; font-weight: 300; line-height: 1; letter-spacing: -.03em; }
  #wxInfo { margin-top: 12px; font-size: 26px; letter-spacing: .04em; color: rgba(255,255,255,.74); white-space: nowrap; }

  #hero { position: absolute; left: 108px; top: 476px; transition: opacity .3s ease; }
  #hero.hidden { opacity: 0; }
  #heroName { font-size: 104px; font-weight: 300; letter-spacing: -.02em; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #heroHint { margin: 22px 0 0 6px; font-size: 26px; font-weight: 400; letter-spacing: .04em; color: rgba(255,255,255,.74); white-space: nowrap; }

  #band { position: absolute; border-radius: calc(var(--tile-r) + var(--band-pad)); background: rgba(20,20,22,.85);
          border: 2px solid rgba(255,255,255,.12); box-sizing: border-box; }

  /* Row titles in the grid ("Free TV", "Streaming & music"…). */
  .section { position: absolute; font-size: 26px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase;
             color: rgba(255,255,255,.74); white-space: nowrap; }

  .tile { position: absolute; width: var(--tile-w); height: var(--tile-h); border-radius: var(--tile-r); overflow: hidden;
          background: #1c1c1e; display: flex; align-items: center; justify-content: center;
          transition: transform .22s cubic-bezier(.2,.8,.2,1); }
  .tile { background-size: 100% 100%; }
  /* The square icon's left and right edges fade into the stretched backdrop, so no seam shows. */
  .tile img { height: 100%; width: auto; display: block;
              -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
              mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%); }
  .tile .label { font-size: 30px; font-weight: 500; padding: 0 20px; text-align: center; }
  .tile.focus { transform: scale(1.1); }
  .tile.press { transform: scale(1.03); transition-duration: .12s; }
  /* Move mode: the tile lifts and follows the arrows. */
  .tile.moving { transform: scale(1.16) translateY(-14px); box-shadow: 0 26px 50px rgba(0,0,0,.7), 0 0 0 4px rgba(255,255,255,.9); z-index: 2;
                 animation: wiggle .9s ease-in-out infinite; }
  @keyframes wiggle { 0%, 100% { rotate: -1.2deg; } 50% { rotate: 1.2deg; } }
  .name { position: absolute; width: var(--tile-w); text-align: center; font-size: 28px; font-weight: 500; letter-spacing: .02em;
          color: rgba(255,255,255,.95); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
          opacity: 0; transform: translateY(-12px); transition: opacity .25s ease, transform .25s ease; }
  .name.show { opacity: 1; transform: translateY(0); }

  /* The single glass highlight: sheen, a bright top specular, a crisp rim and a faint glow. */
  #glass { position: absolute; left: 0; top: 0; border-radius: 36px; pointer-events: none; opacity: 0; transition: opacity .2s ease;
           background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.07));
           border: 3px solid rgba(255,255,255,.8); box-sizing: border-box;
           box-shadow: 0 0 14px 2px rgba(255,255,255,.19); will-change: transform; }
  #glass::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 45%; border-radius: 33px 33px 0 0;
                   background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0)); }
  #glass.on { opacity: 1; }

  /* Without the helper the pills cannot do anything, so they are not shown. */

<script>
(function () {
  'use strict';
  var COLS = 4;
  // The dock's tiles are bigger than the grid's; each grid column is centred under a dock tile.
  var DOCK_W = 400, DOCK_H = 225, DOCK_PITCH = 438, DOCK_LEFT = 103, DOCK_TOP = 690, BAND_PAD = 28;
  var TILE_W = 360, TILE_H = 202, PITCH = DOCK_PITCH, LEFT = DOCK_LEFT + (DOCK_W - TILE_W) / 2;
  var GRID_TOP = DOCK_TOP + DOCK_H + 2 * BAND_PAD + 40, ROW_PITCH = 270, TITLE_H = 60;
  var FOCUS_Y = 640;   // where the focused grid row's tiles sit on screen; the rail slides to put them there

  // Two modes. With the helper (/api/state answers), it launches any app over the TV's remote-control channel.
  // Static (apps.json, ?static=1 to force): it opens web apps by loading their address, which needs nothing but
  // the page; colours are precomputed, since the browser may not read VIDAA's icons.
  var state = { apps: [], dockSize: 4, sections: [], rows: false, clock24: false, greetingName: '', static: false, removedCount: 0,
                loaded: null, takeover: true };
  var focus = { area: 'dock', index: 0, pill: 0, input: 0 };
  var tiles = [], names = [], colours = {}, art = {};
  var $ = function (id) { return document.getElementById(id); };

  // ---------- clock, date, greeting ----------
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var lastMinute = -1;
  function tick() {
    var d = new Date();
    if (d.getMinutes() === lastMinute) return;
    lastMinute = d.getMinutes();
    var h = d.getHours(), m = ('0' + d.getMinutes()).slice(-2);
    if (state.clock24) { $('clock').textContent = ('0' + h).slice(-2) + ':' + m; $('ampm').textContent = ''; }
    else { $('clock').textContent = ((h % 12) || 12) + ':' + m; $('ampm').textContent = h < 12 ? 'am' : 'pm'; }
    $('miniClock').textContent = $('clock').textContent + ($('ampm').textContent ? ' ' + $('ampm').textContent : '');
    // The date shortens (Wed, then Sep) when it would run out of its block or under the buttons; a one-row clock
    // always has the short one.
    var day = DAYS[d.getDay()], month = MONTHS[d.getMonth()], pills = $('pills'), box = $('left').getBoundingClientRect();
    var maxRight = box.right;
    if (pills.offsetWidth && box.top < pills.getBoundingClientRect().bottom) maxRight = Math.min(maxRight, pills.getBoundingClientRect().left - 24);
    for (var fit = state.clockRows === 1 ? 2 : 0; fit < 3; fit++) {
      $('date').innerHTML = (fit ? day.slice(0, 3) : day) + '&nbsp;&nbsp;' + d.getDate() + ' ' + (fit > 1 ? month.slice(0, 3) : month);
      if ($('date').getBoundingClientRect().right <= maxRight) break;
    }
    var g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    $('greeting').textContent = state.greetingName ? g + ', ' + state.greetingName : g;
    drawClockStyle(d);
    showQuote();   // a new one at midnight
    refreshWidgetTimes();   // countdowns
  }
  // ---------- clock styles: Classic (above), Bold, Stacked, Tiles, Analog and Words; one, or a different one each day ----------
  var NUM = ['twelve', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven'];
  var MINW = { 5: 'five', 10: 'ten', 20: 'twenty', 25: 'twenty-five' };
  function timeInWords(h, m) {   // "quarter to twelve", to the nearest five minutes
    var r = Math.round(m / 5) * 5, hh = h;
    if (r === 60) { r = 0; hh++; }
    var now = NUM[hh % 12], next = NUM[(hh + 1) % 12];
    if (r === 0) return [now, "o'clock"];
    if (r === 15) return ['quarter past', now];
    if (r === 30) return ['half past', now];
    if (r === 45) return ['quarter to', next];
    return r < 30 ? [MINW[r] + ' past', now] : [MINW[60 - r] + ' to', next];
  }
  function clockStyleToday() {
    var c = state.clockBlock || {}, rot = c.rotate || [], d = new Date();
    if (rot.length > 1) return rot[Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) % rot.length];
    return c.style || 'classic';
  }
  function wxSnippet() {   // the weather on the clock's date line, when switched on
    var c = state.clockBlock || {}, w = state.wxNow;
    if (!c.weather || !w) return '';
    return '<span class="cs-wx"><svg viewBox="0 0 48 48">' + ICONS[w.icon] + '</svg>' + w.temp + '°</span>';
  }
  function drawClockStyle(d) {
    var style = clockStyleToday(), rows = state.clockRows || 2, box = $('clockStyle');
    var k = rows >= 3 ? 1.9 : rows === 1 ? 0.6 : 1;   // the block's size
    var classic = style === 'classic';
    $('left').setAttribute('data-style', style);
    $('greeting').style.display = classic && rows >= 2 ? '' : 'none';
    $('clockRow').style.display = classic ? '' : 'none';
    box.style.display = classic ? 'none' : '';
    if (classic) {
      var old = $('date').querySelector('.cs-wx'); if (old) old.parentNode.removeChild(old);
      if (wxSnippet()) $('date').insertAdjacentHTML('beforeend', '&nbsp;&nbsp;' + wxSnippet());
      return;
    }
    var h = d.getHours(), m = d.getMinutes(), mm = ('0' + m).slice(-2);
    var hh = state.clock24 ? ('0' + h).slice(-2) : String((h % 12) || 12), ap = state.clock24 ? '' : (h < 12 ? 'am' : 'pm');
    var day = DAYS[d.getDay()], month = MONTHS[d.getMonth()];
    var px = function (n) { var v = Math.round(n * k); if (n <= 40) v = Math.max(v, 24); return v + 'px'; };   // labels: never under 24 px
    var html = '';
    if (style === 'bold') {
      html = '<div class="cs-bold" style="font-size:' + px(124) + '">' + hh + ':' + mm + (ap ? '<span class="cs-ap" style="font-size:' + px(30) + '">' + ap + '</span>' : '') + '</div>' +
             '<div class="cs-bdate" style="font-size:' + px(30) + '">' + (rows === 1 ? day.slice(0, 3) + ', ' + d.getDate() + ' ' + month.slice(0, 3) : day + ', ' + d.getDate() + ' ' + month) + wxSnippet() + '</div>';
    } else if (style === 'stacked') {
      html = '<div class="cs-row"><div class="cs-stack" style="font-size:' + px(rows === 1 ? 60 : 92) + '">' + hh + '<br><span>' + mm + '</span></div>' +
             '<div class="cs-sdate" style="font-size:' + px(26) + '">' + day + '<br>' + d.getDate() + ' ' + month + (wxSnippet() ? '<br>' + wxSnippet() : '') + '</div></div>';
    } else if (style === 'tiles') {
      var tile = function (ch) { return '<span class="cs-tile">' + ch + '</span>'; };
      var digits = (hh.length < 2 && !state.clock24 ? '' : '') + hh;
      html = '<div class="cs-tiles" style="font-size:' + px(78) + '">' + digits.split('').map(tile).join('') + '<span class="cs-colon">:</span>' + mm.split('').map(tile).join('') +
             (ap ? '<span class="cs-ap" style="font-size:' + px(26) + '">' + ap + '</span>' : '') + '</div>' +
             '<div class="cs-tdate" style="font-size:' + px(24) + '">' + day.slice(0, 3) + ' ' + d.getDate() + ' ' + month.slice(0, 3) + wxSnippet() + '</div>';
    } else if (style === 'analog') {
      var size = rows >= 3 ? 290 : rows === 1 ? 92 : 196, ha = ((h % 12) + m / 60) * 30, ma = m * 6, ticks = '';
      for (var t = 0; t < 12; t++) ticks += '<line x1="50" y1="5" x2="50" y2="' + (t % 3 ? 9 : 12) + '" transform="rotate(' + t * 30 + ' 50 50)"/>';
      html = '<div class="cs-row"><svg class="cs-face" width="' + size + '" height="' + size + '" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47"/>' +
             '<g class="tk">' + ticks + '</g><line class="hh" x1="50" y1="50" x2="50" y2="25" transform="rotate(' + ha + ' 50 50)"/>' +
             '<line class="mh" x1="50" y1="50" x2="50" y2="12" transform="rotate(' + ma + ' 50 50)"/><circle class="pin" cx="50" cy="50" r="3"/></svg>' +
             '<div class="cs-sdate" style="font-size:' + px(rows === 1 ? 40 : 28) + '">' + (rows === 1 ? day.slice(0, 3) + ' ' + d.getDate() : day + '<br>' + d.getDate() + ' ' + month) + (wxSnippet() ? '<br>' + wxSnippet() : '') + '</div></div>';
    } else if (style === 'words') {
      var wd = timeInWords(h, m);
      html = '<div class="cs-words" style="font-size:' + px(rows === 1 ? 74 : 60) + '">It’s <i>' + wd[0] + '</i>' + (rows === 1 ? ' ' : '<br>') + wd[1] + '</div>' +
             '<div class="cs-tdate" style="font-size:' + px(24) + '">' + hh + ':' + mm + (ap ? ' ' + ap : '') + '&nbsp;&nbsp;·&nbsp;&nbsp;' + day + ' ' + d.getDate() + ' ' + month + wxSnippet() + '</div>';
    }
    box.innerHTML = html;
  }


  // ---------- quote of the day: from the internet through the helper (/api/quote, with the author's portrait);
  // the built-in quotes.json only when that fails (no internet, or the hosted page without a helper) ----------
  var quotes = null, quoteDay = -1;
  function paintQuote(text, by, source, image) {
    var box = $('quote'), pic = $('quotePic');
    box.classList.remove('pic');
    if (image) { pic.onload = function () { box.classList.add('pic'); }; pic.src = image; }
    $('quoteText').textContent = '“' + text + '”';
    $('quoteBy').textContent = by ? '— ' + by : '';
    $('quoteBy').style.display = by ? '' : 'none';
    $('quoteSrc').textContent = source ? 'Quote via ' + source : '';
    box.style.display = '';
  }
  function showQuote() {
    var box = $('quote');
    if (!state.quotes || !blockOn.quote) { box.style.display = 'none'; return; }
    var d = new Date(), day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
    if (day === quoteDay) return;
    quoteDay = day;
    var builtIn = function () {
      if (!quotes) { quoteDay = -1; return; }   // try again on the next minute's tick
      // The internet quote didn't come: ask again in 10 minutes rather than keep the built-in one all day.
      if (!state.static) setTimeout(function () { if (quoteDay === day) { quoteDay = -1; showQuote(); } }, 10 * 60 * 1000);
      var q = quotes.en[day % quotes.en.length];
      paintQuote(q[0], q[1], '', '');
    };
    if (state.static) { builtIn(); return; }
    load('/api/quote').then(function (q) {
      if (q && q.text) paintQuote(q.text, q.by, q.source, q.image); else builtIn();
    }, builtIn);
  }

  // ---------- weather: the helper fetches it from Open-Meteo, for the place in config "weather" ----------
  var WX = [[[0], 'Clear', 'sun'], [[1, 2], 'Partly cloudy', 'part'], [[3], 'Cloudy', 'cloud'], [[45, 48], 'Fog', 'fog'],
            [[51, 53, 55, 56, 57], 'Drizzle', 'rain'], [[61, 63, 65, 66, 67, 80, 81, 82], 'Rain', 'rain'],
            [[71, 73, 75, 77, 85, 86], 'Snow', 'snow'], [[95, 96, 99], 'Thunderstorm', 'storm']];

    return r.split('').map(function (c) { return { label: c, ch: c, w: 1 }; });
  });
  KEY_ROWS[3].push({ label: '.com', ch: '.com', w: 1, word: true });
  KEY_ROWS.push([{ label: 'Space', ch: ' ', w: 3, word: true }, { label: 'Delete', act: 'del', w: 2, word: true },
                 { label: 'Clear', act: 'clear', w: 2, word: true }, { label: 'Search', act: 'go', w: 3, word: true }]);
  var browser = { open: false, q: '', area: 'keys', row: 1, col: 0, unit: 0, s: 0, l: 0, list: [], kind: 'recent', built: false };

  function recent() { try { return JSON.parse(localStorage.getItem('cyt-recent') || '[]'); } catch (e) { return []; } }
  function remember(q) {
    var list = recent().filter(function (x) { return x !== q; });
    list.unshift(q);
    try { localStorage.setItem('cyt-recent', JSON.stringify(list.slice(0, 7))); } catch (e) {}
  }
  function links() { return (state.browserCfg && state.browserCfg.links) || LINKS; }

  function buildBrowser() {
    var box = $('keys');
    KEY_ROWS.forEach(function (row, r) {
      var unit = 0;
      row.forEach(function (k) {
        k.x = unit; unit += k.w;
        var el = document.createElement('div');
        el.className = 'key' + (k.word ? ' word' : '') + (k.act === 'go' ? ' go' : '');
        el.textContent = k.label;
        el.style.left = (KEY_LEFT + k.x * KEY_UNIT) + 'px'; el.style.top = (KEY_TOP + r * KEY_PITCH) + 'px';
        el.style.width = (k.w * KEY_UNIT - 12) + 'px';
        box.appendChild(el); k.el = el;
      });
    });
    links().forEach(function (l) {
      var c = document.createElement('div'); c.className = 'chip'; c.textContent = l.name; $('links').appendChild(c);
    });
    browser.built = true;
  }

  function renderBrowser() {
    $('browser').classList.toggle('open', browser.open);
    var q = browser.q;
    $('query').textContent = q ? (q.length > 52 ? '…' + q.slice(-51) : q) : 'Search or type a web address';
    $('query').classList.toggle('empty', !q);
    KEY_ROWS.forEach(function (row, r) {
      row.forEach(function (k, c) { k.el.classList.toggle('focus', browser.area === 'keys' && r === browser.row && c === browser.col); });
    });
    var box = $('suggest');
    box.innerHTML = '';
    browser.list.forEach(function (text, i) {
      var r = document.createElement('div');
      r.className = 'row' + (browser.area === 'suggest' && i === browser.s ? ' focus' : '');
      r.textContent = text; box.appendChild(r);
    });
    $('suggestLabel').textContent = !browser.list.length ? '' : browser.kind === 'recent' ? 'Recent' : 'Suggestions';
    var chips = $('links').children;
    for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('focus', browser.area === 'links' && i === browser.l);
  }

  var suggestTimer = 0, suggestSeq = 0;
  function refreshSuggestions() {
    clearTimeout(suggestTimer);
    var q = browser.q, seq = ++suggestSeq;
    if (!q.trim()) { browser.list = recent(); browser.kind = 'recent'; fixFocus(); renderBrowser(); return; }
    suggestTimer = setTimeout(function () {
      var region = (state.browserCfg && state.browserCfg.region) || '';
      load('/api/suggest?q=' + encodeURIComponent(q) + '&kl=' + encodeURIComponent(region)).then(function (list) {
        if (seq !== suggestSeq || !list || !list.slice) return;
        browser.list = list.slice(0, 7); browser.kind = 'suggest'; fixFocus(); renderBrowser();
      }, function () {});
    }, 250);
  }
  function fixFocus() {
    if (browser.area !== 'suggest') return;
    if (!browser.list.length) browser.area = 'keys';
    else browser.s = Math.min(browser.s, browser.list.length - 1);
  }

  function openBrowser() {
    if (!browser.built) buildBrowser();
    browser.open = true; browser.area = 'keys'; browser.row = 1; browser.col = 0; browser.unit = 0;
    focus.beforeBrowser = focus.area; focus.area = 'browser';
    refreshSuggestions(); renderBrowser();
  }
  function closeBrowser() {
    browser.open = false;
    focus.area = focus.beforeBrowser || 'dock';
    renderBrowser(); render();
    expResume();
  }

  // Words go to Brave; something that looks like an address (bbc.com, https://…) opens as it is.
  function addressFor(text) {
    if (/^https?:\/\//i.test(text)) return text;
    if (/^[\w-]+(\.[\w-]+)*\.[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(text)) return 'https://' + text;
    if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?(\/\S*)?$/.test(text)) return 'http://' + text;   // a router's page and the like
    return ((state.browserCfg && state.browserCfg.search) || BRAVE).replace('%s', encodeURIComponent(text));
  }
  function openPage(url) {
    browser.q = '';   // next time the screen opens on the recent searches
    closeBrowser();
    if (!state.static) {
      post('/api/browse', { url: url }).then(function (r) {
        if (!r.ok) toast('Could not open the TV Browser' + (r.error ? ': ' + r.error : ''));
      }, function () { toast('Cannot reach the helper, so the TV Browser did not open'); });
    } else if (state.helper) viaHelper('browse=' + encodeURIComponent(url));
    else setTimeout(function () { location.href = url; }, 120);
  }
  function search(text) {
    text = text.replace(/^\s+|\s+$/g, '');
    if (!text) { toast('Type something to search for'); return; }
    remember(text);
    openPage(addressFor(text));
  }
  function type(ch) {
    if (browser.q.length < 200) browser.q += ch;
    refreshSuggestions(); renderBrowser();
  }

  function browserMove(dx, dy) {
    var rows = KEY_ROWS;
    if (browser.area === 'keys') {
      var row = rows[browser.row];
      if (dx) {
        var c = browser.col + dx;
        if (c >= row.length) { if (browser.list.length) { browser.area = 'suggest'; browser.s = 0; } }
        else browser.col = Math.max(0, c);
        browser.unit = row[browser.col].x;
      }
      if (dy) {
        var r = browser.row + dy;
        if (r >= rows.length) { browser.area = 'links'; browser.l = Math.min(browser.l, links().length - 1); }
        else if (r >= 0) {
          browser.row = r;
          var u = browser.unit, keys = rows[r];
          browser.col = 0;
          for (var i = 0; i < keys.length; i++) if (keys[i].x <= u) browser.col = i;
        }
      }
    } else if (browser.area === 'suggest') {
      if (dy) browser.s = Math.max(0, Math.min(browser.list.length - 1, browser.s + dy));
      if (dx < 0) { browser.area = 'keys'; browser.col = rows[browser.row].length - 1; browser.unit = rows[browser.row][browser.col].x; }
    } else if (browser.area === 'links') {
      if (dx) browser.l = Math.max(0, Math.min(links().length - 1, browser.l + dx));
      if (dy < 0) { browser.area = 'keys'; browser.row = rows.length - 1; browser.col = 0; browser.unit = 0; }
    }
    renderBrowser();
  }
  function browserChoose() {
    if (browser.area === 'suggest') { var t = browser.list[browser.s]; if (t) { browser.q = t; search(t); } return; }
    if (browser.area === 'links') { var l = links()[browser.l]; if (l) openPage(l.url); return; }
    var k = KEY_ROWS[browser.row][browser.col];
    if (k.ch) type(k.ch);
    else if (k.act === 'del') { browser.q = browser.q.slice(0, -1); refreshSuggestions(); renderBrowser(); }
    else if (k.act === 'clear') { browser.q = ''; refreshSuggestions(); renderBrowser(); }
    else search(browser.q);
  }
  function browserKey(e) {
    var k = e.keyCode;
    if (k === 37 || k === 39) browserMove(k === 39 ? 1 : -1, 0);
    else if (k === 38 || k === 40) browserMove(0, k === 40 ? 1 : -1);
    else if (k === 13) { if (!e.repeat || browser.area === 'keys') browserChoose(); }
    else if (k === 8 || k === 461 || k === 27) closeBrowser();
    else if (e.key && e.key.length === 1) type(e.key);   // a keyboard, or a phone remote's typing
    else return;
    e.preventDefault();
  }

  // ---------- start ----------
  tick(); setInterval(tick, 1000);
  if (document.fonts) document.fonts.ready.then(function () { lastMinute = -1; tick(); });   // the date's fit, in the real font
  function load(url) { return fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw r.status; return r.json(); }); }
  // ?helper=http://<lan ip>:8765 in the tile's address: native apps are shown and opened through that helper.
  var orderArg = /[#&]order=([^&]*)/.exec(location.hash);
  if (orderArg) {
    setLocalOrder(orderArg[1] === 'default' || !orderArg[1] ? null : decodeURIComponent(orderArg[1]).split(','));
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  var helperArg = /[?&]helper=([^&]+)/.exec(location.search);
  state.helper = helperArg && /^https?:\/\//.test(decodeURIComponent(helperArg[1])) ? decodeURIComponent(helperArg[1]).replace(/\/+$/, '') : '';

  var PAGES = [{ appId: 'cyt-yt', name: 'YouTube', page: '/yt/', icon: 'pages/yt.png' },
               { appId: 'cyt-tv', name: 'Live TV', page: '/livetv/', icon: 'pages/livetv.png' }];
  function start(s) {
    state.loaded = s;
    if (s.started) { rev.started = s.started; rev.saved = s.saved; }   // the version these settings are: a save made while loading isn't missed
    var apps = s.apps || [], dockSize = s.dock_size;
    state.removedCount = s.removed_count || 0;
    if (typeof s.takeover === 'boolean') state.takeover = s.takeover;
    if (state.static) {
      var removed = localRemoved();
      apps = apps.filter(function (a) { return removed.indexOf(a.appId) < 0; });
      state.removedCount = removed.length;
      // apps.json lists every app once; the dock depends on whether native apps can be opened.
      apps = apps.filter(function (a) { return !a.native || state.helper; });
      // The helper's own screens, when there is a helper; icons come with this page, since it may not load http images.
      if (state.helper) apps = apps.map(function (a) { return a.helper_name ? Object.assign({}, a, { name: a.helper_name }) : a; });
      if (state.helper) PAGES.forEach(function (p) { if (removed.indexOf(p.appId) < 0) apps.push(p); });
      var dock = localOrder() || (state.helper && s.helper_dock) || s.dock || [];
      var rank = function (a) { var i = dock.indexOf(a.appId); return i < 0 ? dock.length : i; };
      apps = apps.map(function (a, i) { return { a: a, i: i }; })
        .sort(function (x, y) { return rank(x.a) - rank(y.a) || x.i - y.i; }).map(function (x) { return x.a; });
      dockSize = localOrder() ? COLS : apps.filter(function (a) { return dock.indexOf(a.appId) >= 0; }).length;
    }
    state.dockSize = Math.min(dockSize || 4, COLS, apps.length);
    // The grid: one untitled block, or titled rows from the config ("rows": [{"title", "apps": [ids]}]),
    // in that order. Apps no row names (one installed later, say) go in a last row, "More".
    var ordered = apps.slice(0, state.dockSize), rest = apps.slice(state.dockSize), rows = s.rows || [];
    state.rows = rows.length > 0;
    state.sections = [];
    rows.forEach(function (r) {
      var picked = [];
      (r.apps || []).forEach(function (id) {
        for (var k = 0; k < rest.length; k++) if (String(rest[k].appId) === String(id)) { picked.push(rest.splice(k, 1)[0]); break; }
      });
      if (picked.length) { state.sections.push({ title: r.title || '', start: ordered.length, count: picked.length }); ordered = ordered.concat(picked); }
    });
    if (rest.length) { state.sections.push({ title: state.rows ? 'More' : '', start: ordered.length, count: rest.length }); ordered = ordered.concat(rest); }
    state.apps = ordered;
    state.clock24 = !!s.clock_24h; state.greetingName = s.greeting_name || '';
    state.quotes = s.quotes !== false; state.weather = !!s.weather; state.wallpaper = !!s.wallpaper;
    state.region = !!s.region;
    state.liveRefresh = s.live_refresh !== false;
    quoteDay = -1; loadWallpaper(); loadRegion(); startRevChecks();
    applyLayout(s.layout);   // places the blocks, then shows the quote and the weather in theirs
    loadWidgets();
    npLoad();
    state.sources = s.sources || [];
    state.browserCfg = s.browser || {};
    document.body.classList.toggle('static', state.static);
    document.body.classList.toggle('helper', !!state.helper);
    try {
      var saved = parseInt(sessionStorage.getItem('cyt-focus'), 10);
      sessionStorage.removeItem('cyt-focus');
      if (saved >= 0 && saved < state.apps.length) { focus.index = saved; focus.lastDock = Math.min(saved, state.dockSize - 1); }
    } catch (e) {}
    if (focus.index >= state.apps.length) focus.index = Math.max(0, state.apps.length - 1);
    if (!onTop()) focus.area = focus.index < state.dockSize ? 'dock' : 'grid';
    lastMinute = -1; tick();
    build(); render();
    expSync();
  }
  // ---------- Home layouts other than Classic (shared/experiences, from the helper at /experiences/) ----------
  // Chosen in the phone panel (Layout); "experience" in /api/state. They draw over this page, which stays as it is
  // underneath: Classic is the fallback (the files don't load, "Classic Home" in their menu, Classic in the panel).
  // Everything they open goes through this page's own ways (openApp, the helper's inputs, scenes, media keys).
  var exp = { ctl: null, loading: false, failed: false, off: false, paused: false, offline: false, scenes: [], wall: null, wx: null, extrasAt: 0 };
  function expBase() { return state.static ? state.helper : ''; }
  function expWanted() { var e = state.loaded && state.loaded.experience; return !exp.off && !exp.failed && e && e.id && e.id !== 'classic' ? e : null; }
  function expActive() { return !!(exp.ctl && !exp.paused); }
  function expLoad(cb) {
    if (window.CYTX && window.CYTX.layouts.theater) { cb(); return; }
    if (exp.loading) return;
    exp.loading = true;
    var base = expBase() + '/experiences/', files = ['catalog.js', 'engine.js', 'layouts.js'], i = 0;
    var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = base + 'experiences.css'; document.head.appendChild(css);
    (function next() {
      if (i >= files.length) { exp.loading = false; cb(); return; }
      var sc = document.createElement('script');
      sc.src = base + files[i++];
      sc.onload = next;
      sc.onerror = function () { exp.loading = false; exp.failed = true; toast('The Home layout did not load: Classic for now'); };
      document.head.appendChild(sc);
    })();
  }
  function expKind(id) {
    if (/^(TV|ATV|DTV)$/i.test(id)) return 'live';
    if (/^HDMI/i.test(id)) return 'hdmi';
    if (/^(DP|AV|AVS|YPBPR|VGA|COMP)/i.test(id)) return 'input';
    return 'other';
  }
  function expData() {
    var s = state.loaded || {}, base = expBase();
    var apps = state.apps.map(function (a) {
      var icon = a.icon || '';
      if (icon && !/^(https?:|data:)/.test(icon)) icon = (icon.charAt(0) === '/' ? base : '') + icon;
      return { id: String(a.appId), name: String(a.name || '').replace('▶', '').trim(), icon: icon, color: colours[a.appId] || '',
               kind: a.page ? 'page' : a.browser ? 'page' : (a.url && !a.native ? 'web' : 'app'), live: a.appId === 'cyt-tv' };
    });
    var rows = state.sections.map(function (sec) {
      return { title: sec.title, ids: state.apps.slice(sec.start, sec.start + sec.count).map(function (a) { return String(a.appId); }) };
    });
    var np = npNow ? { title: npNow.title || npNow.name, subtitle: npNow.subtitle || '', name: npNow.name || '', state: npNow.state, art: npNow.screen_icon || '' } : null;
    return {
      platform: 'vidaa', online: !exp.offline && (!state.static || !!state.helper), clock24: state.clock24, apps: apps,
      favorites: state.apps.slice(0, state.dockSize).map(function (a) { return String(a.appId); }), rows: rows,
      sources: (state.sources || []).map(function (x) { return { id: x.id, name: x.name, kind: expKind(x.id) }; }),
      scenes: exp.scenes, widgets: (addonHome && addonHome.widgets) || [], np: np, weather: state.weather ? exp.wx : null,
      wallpaper: exp.wall && exp.wall.image ? base + exp.wall.image : '', wallpaperTitle: exp.wall ? exp.wall.title || '' : '',
      region: state.region && region.list.length ? { now: region.now || 'off', list: region.list } : null,
      caps: { sources: (state.sources || []).length > 0 && (!state.static || !!state.helper), scenes: !state.static, media: !state.static, region: state.region },
      experience: s.experience || { id: 'classic', opts: {} },
      iconTheme: (addonHome && addonHome.icon_theme) || null
    };
  }
  // Scenes, the weather and the photo's details: once, then every 15 minutes (the photo also on a new one)
  function expExtras() {
    if (state.static || !exp.ctl) return;
    exp.extrasAt = Date.now();
    load('/api/home-scenes').then(function (r) { exp.scenes = (r && r.scenes) || []; expRefresh(); }, function () {});
    if (state.weather) load('/api/weather').then(function (w) { exp.wx = w; expRefresh(); }, function () {});
    if (state.wallpaper) load('/api/wallpaper').then(function (w) { exp.wall = w && w.image ? w : null; expRefresh(); }, function () {});
  }
  var expHost = {
    platform: 'vidaa',
    open: function (it) {
      if (it.type === 'source') {
        if (state.static) { viaHelper('source=' + encodeURIComponent(it.id)); return Promise.resolve({ ok: true }); }
        return post('/api/tv-source', { id: it.id });
      }
      var app = state.apps.filter(function (a) { return String(a.appId) === it.id; })[0];
      if (!app) return Promise.resolve({ ok: false, error: 'it is not on the TV' });
      return openApp(app);
    },
    scene: function (id) { return post('/api/home-scene-run', { id: id }); },
    media: function (k) { npSend(k); },
    region: function (id) { return post('/api/region', { region: id }).then(function (r) { loadRegion(); return r; }); },
    admin: function () { expPause(); openAdmin(); },
    classic: function () { exp.off = true; expSync(); toast('Classic Home, until the page reloads'); },
    settings: function () { viaHelper('key=KEY_SETTINGS'); }
  };
  function expSync() {
    var want = expWanted(), box = $('cytx');
    if (!want) {
      if (exp.ctl) { exp.ctl.destroy(); exp.ctl = null; }
      box.style.display = 'none';
      document.body.classList.remove('exp');
      return;
    }
    expLoad(function () {
      if (!exp.ctl) {
        box.style.display = '';
        exp.ctl = CYTX.mount(box, expHost, null);
        document.body.classList.add('exp');
        setInterval(function () { if (Date.now() - exp.extrasAt > 15 * 60000) expExtras(); }, 60000);
        expExtras();
      }
      exp.ctl.update(expData());
    });
  }
  var expTimer = 0;
  function expRefresh() {   // new data for the layout, a little later (several arrive together)
    if (!exp.ctl) return;
    clearTimeout(expTimer);
    expTimer = setTimeout(function () { if (exp.ctl) exp.ctl.update(expData()); }, 80);
  }
  function expPause() { if (exp.ctl) { exp.paused = true; $('cytx').style.display = 'none'; } }
  function expResume() { if (exp.ctl && exp.paused) { exp.paused = false; $('cytx').style.display = ''; } }
  // OK: a tap opens; held (the key repeats, or no key-up for 650 ms on a remote that sends them) opens the menu.
  var expOk = { pending: false, timer: 0, keyup: false };
  function expOkUp() {
    expOk.keyup = true;
    if (expOk.pending) { clearTimeout(expOk.timer); expOk.pending = false; exp.ctl.key('ok'); }
  }
  function expKey(e) {
    if (mediaKey(e)) { e.preventDefault(); return; }
    var k = e.keyCode;
    if (k === 13) {
      e.preventDefault();
      if (expOk.pending) { clearTimeout(expOk.timer); expOk.pending = false; exp.ctl.key('menu'); return; }
      expOk.pending = true;
      expOk.timer = setTimeout(function () { if (!expOk.pending) return; expOk.pending = false; exp.ctl.key(expOk.keyup ? 'menu' : 'ok'); }, 650);
      return;
    }
    var name = CYTX.keyName(e);
    if (name && exp.ctl.key(name)) e.preventDefault();
  }

  // ---------- the QR button: open the admin panel on a phone ----------
  function openAdmin() {
    load('/api/admin-link').then(function (a) {
      // Three codes: the admin panel, its remote and its player, each opened straight on the phone.
      var links = a.links || [{ label: 'Admin panel', url: a.url, qr: a.qr }], box = $('adminQrs');
      box.innerHTML = '';
      links.forEach(function (link) {
        var wrap = document.createElement('div'), c = document.createElement('canvas');
        c.width = c.height = 300;
        var rows = link.qr || [], n = rows.length, x = c.getContext('2d');
        var cell = Math.floor(c.width / (n + 8)), off = Math.floor((c.width - cell * n) / 2);
        x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        x.fillStyle = '#000';
        for (var r = 0; r < n; r++) for (var q = 0; q < n; q++) if (rows[r].charAt(q) === '1') x.fillRect(off + q * cell, off + r * cell, cell, cell);
        wrap.appendChild(c); wrap.appendChild(document.createTextNode(link.label));
        box.appendChild(wrap);
      });
      $('adminUrl').textContent = a.url.replace(/^http:\/\//, '');
      focus.area = 'admin';
      $('adminBox').classList.add('open'); $('scrim').classList.add('on');
      render();
    }, function () { toast('Cannot reach the helper'); });
  }
  function closeAdmin() {
    $('adminBox').classList.remove('open'); $('scrim').classList.remove('on');
    focus.area = 'pills'; render();
    expResume();
  }

  // ---------- changes from the admin panel: a save restarts the helper, a new photo changes its address ----------
  var rev = { started: 0, wall: '' }, revTimer = 0;
  function checkRev() {
    if (state.static) return;
    load('/api/rev').then(function (r) {
      var first = !rev.started;
      var calm = focus.area !== 'menu' && focus.area !== 'move' && focus.area !== 'browser' && focus.area !== 'admin' && focus.area !== 'edit';
      if (rev.code && r.code && r.code !== rev.code && calm) { location.reload(); return; }   // the launcher itself was updated
      if (!first && (r.started !== rev.started || r.saved !== rev.saved) && focus.area !== 'menu' && focus.area !== 'move' && focus.area !== 'browser' && focus.area !== 'admin') {
        rev = r; quoteDay = -1; load('/api/state').then(start, function () {});   // new settings (a new quote source too): rebuild Home in place
        return;
      }
      if (!first && r.wall !== rev.wall) { loadWallpaper(); exp.wall = null; expExtras(); }
      rev = r;
      if (exp.offline) { exp.offline = false; expRefresh(); }
    }, function () { if (!exp.offline) { exp.offline = true; expRefresh(); } });
  }
  // Off in the admin panel ("Update right away"): changes show the next time Home opens, the photo within the hour.
  function startRevChecks() {
    if (state.liveRefresh && !revTimer) { revTimer = setInterval(checkRev, 3000); checkRev(); }
    else if (!state.liveRefresh && revTimer) { clearInterval(revTimer); revTimer = 0; }
  }

  function startStatic() {
    state.static = true;
    load('apps.json').then(start, function () { toast('Could not load the app list'); });
  }
  load('quotes.json').then(function (q) { quotes = q; quoteDay = -1; showQuote(); }, function () {});
  if (/[?&]static=1/.test(location.search)) startStatic();
  else load('/api/state').then(start, startStatic);
})();
</script>
</body>
